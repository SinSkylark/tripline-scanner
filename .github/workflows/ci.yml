name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scanner security test (QR-target allow-list)
        run: node tests/test_scanner_security.js

      - name: i18n + QR-contract test (pl/en parity, parseQR unchanged)
        run: node tests/test_i18n.js

      - name: Voting feature-flag test (survey OFF by default)
        run: node tests/test_voting_flag.js
